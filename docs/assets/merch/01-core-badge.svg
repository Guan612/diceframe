<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="DiceFrame circular badge">
  <title>DiceFrame — core badge</title>
  <defs>

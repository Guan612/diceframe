      <rect x="14" y="14" width="72" height="72" rx="10" stroke="#c7a362" stroke-width="1.3" opacity="0.55"/>
      <rect x="29" y="29" width="42" height="42" rx="8.5" fill="#251b13" stroke="#f0d8a0" stroke-width="2.4"/>
      <g fill="#e8cf94">

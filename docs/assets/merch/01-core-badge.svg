        <circle cx="59" cy="41" r="3.9"/>
        <circle cx="50" cy="50" r="3.9"/>
        <circle cx="41" cy="59" r="3.9"/>
        <circle cx="59" cy="59" r="3.9"/>
      </g>
    </g>
  </defs>

  <circle cx="500" cy="500" r="492" fill="#0b1117"/>
  <circle cx="500" cy="500" r="492" fill="url(#df-badge-glow)"/>

  <circle cx="500" cy="500" r="470" fill="none" stroke="#c7a362" stroke-width="7"/>
  <circle cx="500" cy="500" r="452" fill="none" stroke="#c7a362" stroke-width="1.5" opacity="0.7"/>


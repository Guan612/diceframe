<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Party of four sticker">
  <title>Party up — multiplayer sticker</title>
  <defs>
    <radialGradient id="party-plate" gradientUnits="userSpaceOnUse" cx="500" cy="360" r="720">
      <stop offset="0" stop-color="#182634"/>
      <stop offset="0.62" stop-color="#101923"/>
      <stop offset="1" stop-color="#0a1016"/>
    </radialGradient>
    <radialGradient id="party-table" gradientUnits="userSpaceOnUse" cx="470" cy="540" r="270">
      <stop offset="0" stop-color="#22303d"/>
      <stop offset="1" stop-color="#141f2a"/>
    </radialGradient>
    <clipPath id="party-clip"><rect x="30" y="30" width="940" height="940" rx="96"/></clipPath>
    <g id="party-chair">
      <rect x="-62" y="-44" width="124" height="88" rx="26" fill="#16222e" stroke="#c7a362" stroke-width="3"/>
      <circle cx="0" cy="0" r="27" fill="#c7a362"/>
      <circle cx="0" cy="0" r="27" fill="none" stroke="#f0d8a0" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="17" fill="none" stroke="#111a24" stroke-width="2.2" opacity="0.65"/>
      <circle cx="0" cy="0" r="5" fill="#111a24" opacity="0.65"/>
    </g>
    <g id="party-open-chair">
      <rect x="-62" y="-44" width="124" height="88" rx="26" fill="#0f1a24" stroke="#5d6f79" stroke-width="3" stroke-dasharray="11 10"/>
      <path d="M-13 0h26M0 -13v26" stroke="#8195a0" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <g clip-path="url(#party-clip)">
    <rect x="30" y="30" width="940" height="940" fill="url(#party-plate)"/>
    <rect x="30" y="30" width="940" height="940" fill="none" stroke="#c7a362" stroke-width="9"/>
    <rect x="58" y="58" width="884" height="884" rx="74" fill="none" stroke="#c7a362" stroke-width="1.4" opacity="0.4"/>
  </g>

  <text x="500" y="158" text-anchor="middle" font-family="'Aptos','Segoe UI',system-ui,sans-serif" font-size="20" letter-spacing="9" fill="#8f7f5e">1–4 PLAYERS · ONE AI GM</text>
  <text x="500" y="256" text-anchor="middle" font-family="'Palatino Linotype','Iowan Old Style',Palatino,Georgia,serif" font-size="88" letter-spacing="12" fill="#f0eee5">PARTY UP</text>

  <!-- table -->
  <circle cx="500" cy="570" r="188" fill="url(#party-table)" stroke="#c7a362" stroke-width="3"/>
  <circle cx="500" cy="570" r="160" fill="none" stroke="#c7a362" stroke-width="1.2" opacity="0.35" stroke-dasharray="2 10"/>
  <g transform="translate(500 570) scale(0.64)" fill="none" stroke="#f0d8a0" stroke-width="7" stroke-linejoin="round">
    <path d="M50.00,23.61L77.68,-61.80 M50.00,23.61L94.79,38.20 M50.00,23.61L-56.60,38.20 M50.00,23.61L11.80,100.00 M50.00,23.61L-15.88,-61.80 M77.68,-61.80L94.79,38.20 M77.68,-61.80L-11.80,-100.00 M77.68,-61.80L-15.88,-61.80 M94.79,38.20L11.80,100.00 M-11.80,-100.00L-15.88,-61.80 M-11.80,-100.00L-94.79,-38.20 M-56.60,38.20L11.80,100.00 M-56.60,38.20L-15.88,-61.80 M-56.60,38.20L-77.68,61.80 M-56.60,38.20L-94.79,-38.20 M11.80,100.00L-77.68,61.80 M-15.88,-61.80L-94.79,-38.20 M-77.68,61.80L-94.79,-38.20"/>
  </g>

  <!-- seats: three taken, one open (SE) -->
  <use href="#party-chair" xlink:href="#party-chair" transform="translate(288 358) rotate(45)"/>
  <use href="#party-chair" xlink:href="#party-chair" transform="translate(712 358) rotate(-45)"/>
  <use href="#party-chair" xlink:href="#party-chair" transform="translate(288 782) rotate(135)"/>
  <use href="#party-open-chair" xlink:href="#party-open-chair" transform="translate(712 782) rotate(-135)"/>

  <text x="500" y="912" text-anchor="middle" font-family="'Aptos','Segoe UI',system-ui,sans-serif" font-size="19" letter-spacing="7" fill="#8f7f5e">DICEFRAME · SOLO OR WITH FRIENDS</text>
</svg>
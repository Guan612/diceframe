      <path d="M531.5 49.1A452 452 0 0 1 846.3 209.5"/>
      <path d="M883.3 260.5A452 452 0 0 1 929.9 639.7"/>
      <path d="M906.3 698.1A452 452 0 0 1 624.6 934.5"/>
      <path d="M562.9 947.6A452 452 0 0 1 234.3 865.7"/>
      <path d="M191.7 830.6A452 452 0 0 1 48.3 515.8"/>
      <path d="M50.5 452.8A452 452 0 0 1 174.9 186.0"/>
      <path d="M215.5 148.7A452 452 0 0 1 547.2 50.5"/>
    </g>

    <!-- cracked die -->
    <g transform="translate(500 492) scale(1.62)" fill="none" stroke="#a89a83" stroke-width="4.2" stroke-linejoin="round">
      <use href="#nat1-d20" xlink:href="#nat1-d20"/>
    </g>

    <!-- crack: erase then cut -->
    <path d="M352 300 L438 372 L404 434 L492 500 L452 570 L536 664 L512 726"

  <circle cx="500" cy="500" r="486" fill="none" stroke="#8d8375" stroke-width="5" opacity="0.9"/>

  <text x="500" y="196" text-anchor="middle" font-family="'Aptos','Segoe UI',system-ui,sans-serif" font-size="52" font-weight="600" letter-spacing="22" fill="#b9a179">NATURAL ONE</text>

  <text x="500" y="800" text-anchor="middle" font-family="'Palatino Linotype','Iowan Old Style',Palatino,Georgia,serif" font-style="italic" font-size="46" fill="#cfd4c9">the story continues</text>
  <text x="500" y="862" text-anchor="middle" font-family="'Aptos','Segoe UI',system-ui,sans-serif" font-size="19" letter-spacing="8" fill="#7b8783">DICEFRAME · d20</text>

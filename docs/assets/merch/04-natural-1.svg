<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Natural 1 cracked die sticker">
  <title>Natural 1 — cracked die sticker</title>
  <defs>
    <radialGradient id="nat1-plate" gradientUnits="userSpaceOnUse" cx="470" cy="420" r="560">
      <stop offset="0" stop-color="#1b2732"/>
      <stop offset="0.6" stop-color="#121a23"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </radialGradient>
    <clipPath id="nat1-clip"><circle cx="500" cy="500" r="486"/></clipPath>
    <g id="nat1-d20">
      <path d="M50.00,23.61L77.68,-61.80 M50.00,23.61L94.79,38.20 M50.00,23.61L-56.60,38.20 M50.00,23.61L11.80,100.00 M50.00,23.61L-15.88,-61.80 M77.68,-61.80L94.79,38.20 M77.68,-61.80L-11.80,-100.00 M77.68,-61.80L-15.88,-61.80 M94.79,38.20L11.80,100.00 M-11.80,-100.00L-15.88,-61.80 M-11.80,-100.00L-94.79,-38.20 M-56.60,38.20L11.80,100.00 M-56.60,38.20L-15.88,-61.80 M-56.60,38.20L-77.68,61.80 M-56.60,38.20L-94.79,-38.20 M11.80,100.00L-77.68,61.80 M-15.88,-61.80L-94.79,-38.20 M-77.68,61.80L-94.79,-38.20"/>
    </g>
  </defs>

  <circle cx="500" cy="500" r="486" fill="url(#nat1-plate)"/>

  <g clip-path="url(#nat1-clip)">

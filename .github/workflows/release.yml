name: Build Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Build release zip
        run: python scripts/build_release.py

      - name: Generate SHA-256 sidecar
        shell: bash
        run: |
          cd dist
          for f in *.zip; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diceframe-windows-zip
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256

  windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Build portable zip
        run: python scripts/build_portable.py

      - name: Generate SHA-256 sidecar
        shell: bash
        run: |
          cd dist
          for f in *.zip; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diceframe-windows-portable
          if-no-files-found: error
          path: |
            dist/*portable*.zip
            dist/*portable*.sha256

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-zip, windows-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download source package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: diceframe-windows-zip
          path: dist

      - name: Download portable package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: diceframe-windows-portable
          path: dist

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          source_zip="DiceFrame-${GITHUB_REF_NAME}-windows.zip"
          portable_zip="DiceFrame-${GITHUB_REF_NAME}-windows-portable.zip"
          cd dist
          for file in \
            "$source_zip" \
            "$source_zip.sha256" \
            "$portable_zip" \
            "$portable_zip.sha256"
          do
            test -s "$file"
          done
          sha256sum --check "$source_zip.sha256" "$portable_zip.sha256"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: false
          preserve_order: true
          files: |
            dist/DiceFrame-${{ github.ref_name }}-windows.zip
            dist/DiceFrame-${{ github.ref_name }}-windows.zip.sha256
            dist/DiceFrame-${{ github.ref_name }}-windows-portable.zip
            dist/DiceFrame-${{ github.ref_name }}-windows-portable.zip.sha256
